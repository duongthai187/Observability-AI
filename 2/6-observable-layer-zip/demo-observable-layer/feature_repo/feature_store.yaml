project: mlops5
provider: gcp
registry:
  registry_type: sql
  path: postgresql+psycopg2://airflow:airflow@127.0.0.1:5433/feast
  cache_ttl_seconds: 60
  sqlalchemy_config_kwargs:
    echo: false
    pool_pre_ping: true
online_store:
  type: milvus
  host: localhost
  port: 19530
  vector_enabled: true
  text_search_enabled: true
  embedding_dim: 384
  index_type: "IVF_FLAT"
  metric_type: "COSINE"


offline_store:
  type: file
entity_key_serialization_version: 3